apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipecd-demo
  labels:
    app: pipecd-demo
    pipecd.dev/variant: primary    # Etiqueta requerida por PipeCD
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pipecd-demo
      pipecd.dev/variant: primary
  template:
    metadata:
      labels:
        app: pipecd-demo
        pipecd.dev/variant: primary
    spec:
      containers:
      - name: helloworld
        image: gcr.io/pipecd/helloworld:v0.1.0    # Imagen de ejemplo de PipeCD[reference:9]
        ports:
        - containerPort: 9085
